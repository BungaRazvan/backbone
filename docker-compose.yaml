services:
  web:
    image: backbone:latest
    container_name: backbone_web
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backbone_db:/app/databases
      - ./staticfiles:/app/staticfiles
      - backbone_media:/app/media
    security_opt:
      - seccomp=unconfined
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    image: backbone:latest
    container_name: backbone_worker
    volumes:
      - backbone_db:/app/databases
      - backbone_media:/app/media
    env_file:
      - .env.prod
    command: celery -A backbone worker -l info -c 1
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    image: backbone:latest
    container_name: backbone_beat
    env_file:
      - .env.prod
    volumes:
      - backbone_db:/app/databases
    command: celery -A backbone beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - web
    restart: unless-stopped

  redis:
    image: arm32v7/redis:6.0.6
    container_name: backbone_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - backbone_redis_data:/data
    command: redis-server
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: backbone_mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  bmw-bridge:
    image: ghcr.io/dj0abr/bmw-mqtt-bridge:latest
    container_name: backbone_bmw_bridge
    restart: unless-stopped
    environment:
      - XDG_STATE_HOME=/app/state
      - LOCAL_HOST=mosquitto
      - LOCAL_PORT=1883
    volumes:
      - bmw_bridge_data:/app/state
    depends_on:
      - mosquitto

  bmw-listener:
    image: backbone:latest
    container_name: backbone_bmw_listener
    volumes:
      - backbone_db:/app/databases
    env_file:
      - .env.prod
    command: python manage.py run_bmw_mqtt
    depends_on:
      - redis
      - mosquitto
      - worker
    restart: unless-stopped

volumes:
  backbone_redis_data:
    external: true
  backbone_media:
    external: true
  backbone_db:
    external: true
  mosquitto_data:
    external: true
  mosquitto_log:
    external: true
  bmw_bridge_data:
    external: true
